<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Name City: type your name and a city made of text builds it in 3D. Flutter + flutter_scene.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Name City">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>名前の街 · Name City</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* The loading screen (lifted by lib/loading.dart once the city is ready). */
    html, body { margin: 0; height: 100%; background: #081728; }
    #loading {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      background: #081728; color: #E3F2FF;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", system-ui, sans-serif;
      transition: opacity 0.7s ease-out;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading .title { font-size: clamp(24px, 4vw, 44px); font-weight: 700; letter-spacing: 0.02em; }
    #loading .bricks { display: flex; gap: 8px; }
    #loading .bricks i {
      width: 14px; height: 14px; border-radius: 2px; background: #1C4570;
      animation: lay 1.6s infinite; animation-delay: calc(var(--i) * 0.1s);
    }
    @keyframes lay { 0% { background: #1C4570; } 10%, 70% { background: #FFC66D; } 80%, 100% { background: #1C4570; } }
    #loading .stage { font: 500 15px ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: #8DB7DA; letter-spacing: 0.04em; }
    @media (prefers-reduced-motion: reduce) { #loading .bricks i { animation: none; background: #FFC66D; } }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="loading" role="status" aria-live="polite">
    <div class="title">名前の街 · Name City</div>
    <div class="bricks"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i><i style="--i:7"></i><i style="--i:8"></i><i style="--i:9"></i><i style="--i:10"></i><i style="--i:11"></i></div>
    <div class="stage" id="loading-stage">Loading · 読み込み中</div>
  </div>
  <script>
    // Driven by the app (lib/loading_web.dart): what's being got ready, and done.
    window.nameCityLoading = {
      stage(text) {
        const s = document.getElementById('loading-stage');
        if (s) s.textContent = text;
      },
      done() {
        const l = document.getElementById('loading');
        if (!l || l.classList.contains('done')) return;
        l.classList.add('done');
        setTimeout(() => l.remove(), 700);
      },
    };
    // Never up for good: the app's own loading screen carries on beneath.
    setTimeout(() => window.nameCityLoading.done(), 60000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
