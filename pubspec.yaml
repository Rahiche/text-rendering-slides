name: text_slides
description: "Interactive slides: how text rendering works, and how Flutter does it."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  characters: any
  kumihan:
    path: packages/kumihan
  slug:
    path: packages/slug
  dart_earcut: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
    - family: NotoKufiArabic
      fonts:
        - asset: assets/fonts/NotoKufiArabic.ttf
    # Tiny subsets (just the "case" characters) of Noto Sans JP / SC, so the
    # detective world can show the same code point in both regional forms.
    - family: CaseJP
      fonts:
        - asset: assets/fonts/NotoSansJP-case.ttf
    - family: CaseSC
      fonts:
        - asset: assets/fonts/NotoSansSC-case.ttf
